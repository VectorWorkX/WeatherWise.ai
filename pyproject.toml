[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weatherwise"
version = "0.1.0"
description = "Stateful multi-agent weather analysis system using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-pinecone>=0.2.0",
    "pinecone>=5.0.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "tenacity>=9.0.0",
    "pydantic>=2.0.0",
    "langsmith>=0.3.0",
    "langchain>=1.2.0",
    "langgraph-checkpoint-redis>=0.3.0",
]

[project.optional-dependencies]
ingestion = [
    "unstructured[pdf]>=0.16.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]

[project.scripts]
weatherwise = "weatherwise.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherwise"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Use `streamable_http_client` instead:DeprecationWarning",
]
