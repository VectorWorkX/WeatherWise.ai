[project]
name = "weatherwise-ai"
version = "0.1.0"
description = "An agentic weather system that acts as an Expert Analyst"
authors = [
    {name = "Ishita S"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.8,<2.0.0",
    "langchain-anthropic>=1.3.2,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "langchain-mcp-adapters>=0.2.1,<0.3.0",
    "langchain>=1.2.9,<2.0.0",
    "numexpr>=2.14.1,<3.0.0",
    "langchain-community>=0.4.1,<0.5.0",
    "langchain-experimental>=0.4.1,<0.5.0",
    "unstructured[pdf,image]>=0.18.0,<1.0.0",
    "langchain-chroma>=1.1.0,<2.0.0",
    "chromadb>=1.4.0,<2.0.0",
    "pillow>=12.0.0,<13.0.0",
    "langchain-openai>=1.1.0,<2.0.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
