steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/weatherwise/app:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/weatherwise/app:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/weatherwise/app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/weatherwise/app:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'weatherwise'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/weatherwise/app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--update-env-vars'
      - 'SERVE_FRONTEND=1,FRONTEND_DIST_DIR=/app/frontend/dist,ENVIRONMENT=production,CHECKPOINTER_MODE=memory,LOG_FORMAT=json,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=weatherwise-ai,PINECONE_INDEX_NAME=weatherwise-knowledge,XWEATHER_MCP_URL=https://mcp.api.xweather.com/mcp'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '900s'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/weatherwise/app:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/weatherwise/app:latest'
